<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识图谱可视化 - AI 智能录音助手</title>

  <!-- AntV G6 v5 CDN -->
  <script src="https://unpkg.com/@antv/g6@5/dist/g6.min.js"></script>

  <!-- 图谱样式 -->
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- ============================================ -->
  <!-- 顶部工具栏 -->
  <!-- ============================================ -->
  <div class="graph-toolbar">
    <!-- 左侧：标题 -->
    <div class="graph-toolbar-left">
      <h1 class="graph-title">知识图谱</h1>
      <div id="graph-stats" class="graph-stats"></div>
    </div>

    <!-- 中间：筛选条件 -->
    <div class="graph-toolbar-center">
      <!-- 时间范围 -->
      <div class="graph-filter-group">
        <label class="graph-filter-label">时间</label>
        <select id="graph-filter-time" class="graph-select">
          <option value="all">全部</option>
          <option value="1m">最近1个月</option>
          <option value="3m" selected>最近3个月</option>
          <option value="6m">最近6个月</option>
        </select>
      </div>

      <!-- 关系类型 -->
      <div class="graph-filter-group">
        <label class="graph-filter-label">关系</label>
        <select id="graph-filter-relation" class="graph-select">
          <option value="">全部关系</option>
          <option value="参与">参与</option>
          <option value="提及">提及</option>
          <option value="触发">触发</option>
          <option value="相关">相关</option>
        </select>
      </div>

      <!-- 人物 -->
      <div class="graph-filter-group">
        <label class="graph-filter-label">人物</label>
        <select id="graph-filter-person" class="graph-select">
          <option value="">全部人物</option>
        </select>
      </div>
    </div>

    <!-- 右侧：操作按钮 -->
    <div class="graph-toolbar-right">
      <button id="graph-refresh" class="graph-btn graph-btn-icon" title="手动刷新数据">
        <span class="graph-icon-refresh">&#x21bb;</span>
        <span class="graph-btn-label">刷新</span>
      </button>
      <button id="graph-export-png" class="graph-btn graph-btn-icon" title="导出为 PNG">
        <span class="graph-icon-image">&#x1f5bc;</span>
        <span class="graph-btn-label">导出 PNG</span>
      </button>
      <button id="graph-export-json" class="graph-btn graph-btn-icon" title="导出数据为 JSON">
        <span class="graph-icon-json">{ }</span>
        <span class="graph-btn-label">导出 JSON</span>
      </button>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- 搜索栏 -->
  <!-- ============================================ -->
  <div class="graph-search-bar">
    <div class="graph-search-wrapper">
      <span class="graph-search-icon">&#x1f50d;</span>
      <input
        id="graph-search-input"
        class="graph-search-input"
        type="text"
        placeholder="搜索节点名称或属性... (Ctrl+F)"
        autocomplete="off"
      />
      <button id="graph-search-clear" class="graph-search-clear" title="清除搜索">&times;</button>
      <span id="graph-search-count" class="graph-search-count"></span>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- 图谱画布 -->
  <!-- ============================================ -->
  <div class="graph-main">
    <div id="graph-container" class="graph-container">
      <!-- 加载状态 -->
      <div class="graph-loading-state" id="graph-loading">
        <div class="graph-loading-spinner"></div>
        <p>正在加载知识图谱...</p>
      </div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- 图例 -->
  <!-- ============================================ -->
  <div class="graph-legend">
    <span class="graph-legend-title">图例</span>
    <span class="graph-legend-item">
      <span class="graph-legend-dot" style="background: #1890FF; border-radius: 50%;"></span>
      人物
    </span>
    <span class="graph-legend-item">
      <span class="graph-legend-dot" style="background: #F5222D; border-radius: 2px;"></span>
      事件
    </span>
    <span class="graph-legend-item">
      <span class="graph-legend-dot" style="background: #52C41A; transform: rotate(45deg);"></span>
      对话
    </span>
    <span class="graph-legend-divider"></span>
    <span class="graph-legend-item">
      <span class="graph-legend-line" style="border-color: #1890FF;"></span>
      参与
    </span>
    <span class="graph-legend-item">
      <span class="graph-legend-line" style="border-color: #722ED1;"></span>
      提及
    </span>
    <span class="graph-legend-item">
      <span class="graph-legend-line" style="border-color: #FA8C16;"></span>
      触发
    </span>
    <span class="graph-legend-item">
      <span class="graph-legend-line" style="border-color: #BFBFBF;"></span>
      相关
    </span>
  </div>

  <!-- ============================================ -->
  <!-- 入口脚本（ES Module） -->
  <!-- ============================================ -->
  <script type="module" src="./index.ts"></script>
</body>
</html>
